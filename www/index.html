<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f7a4a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="CS Coach" />
  <title>CS Coach – Civil Service Exam Reviewer</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <button id="backBtn" class="icon-btn hidden" aria-label="Back">←</button>
    <div class="brand">
      <span class="logo">CS</span>
      <div>
        <h1>CS Coach</h1>
        <p class="tagline">Civil Service Exam · Professional</p>
      </div>
    </div>
    <button id="settingsBtn" class="icon-btn settings" aria-label="Settings" title="Settings">⚙️</button>
  </header>
  <main id="app"></main>
  <nav class="tabbar hidden" id="tabbar" aria-label="Main">
    <button data-tab="learn"><span class="tab-ico">📖</span><span class="tab-label">Learn</span></button>
    <button data-tab="practice"><span class="tab-ico">✏️</span><span class="tab-label">Practice</span></button>
    <button data-tab="analytics"><span class="tab-ico">📊</span><span class="tab-label">Analytics</span></button>
  </nav>
  <script src="i18n.js"></script>
  <script src="questions.js"></script>
  <script src="questions-more.js"></script>
  <script src="lessons.js"></script>
  <script src="pet.js"></script>
  <script src="app.js"></script>
  <script src="coach.js"></script>
</body>
</html>
